    <rect x="26" y="42" width="8" height="8" fill="#475569"/>
    <rect x="16" y="50" width="28" height="5" rx="2" fill="#475569"/>
  </g>
  <text x="110" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Kali Linux</text>
  <text x="110" y="173" text-anchor="middle" font-size="12" fill="#475569">Attacker · Hydra</text>
  <text x="110" y="191" text-anchor="middle" font-size="12" fill="#475569">192.168.129.128</text>

  <!-- Ubuntu -->
  <rect x="385" y="55" width="170" height="150" rx="12" fill="#fff7ed" stroke="#e95420" stroke-width="2"/>
  <g transform="translate(440,69)">
    <rect x="2" y="2" width="56" height="16" rx="4" fill="#e95420"/>
    <rect x="2" y="21" width="56" height="16" rx="4" fill="#e95420"/>
    <rect x="2" y="40" width="56" height="16" rx="4" fill="#e95420"/>
    <circle cx="12" cy="10" r="3" fill="#fff"/><circle cx="12" cy="29" r="3" fill="#fff"/><circle cx="12" cy="48" r="3" fill="#fff"/>
    <rect x="24" y="8" width="26" height="4" rx="2" fill="#fff" opacity=".8"/>
    <rect x="24" y="27" width="26" height="4" rx="2" fill="#fff" opacity=".8"/>
    <rect x="24" y="46" width="26" height="4" rx="2" fill="#fff" opacity=".8"/>
