  <text x="470" y="173" text-anchor="middle" font-size="12" fill="#475569">Wazuh Agent · SSH :2222</text>
  <text x="470" y="191" text-anchor="middle" font-size="12" fill="#475569">192.168.129.129</text>

  <!-- Wazuh -->
  <rect x="835" y="55" width="170" height="150" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
  <g transform="translate(890,69)">
