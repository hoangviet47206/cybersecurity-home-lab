  <text x="885" y="255" text-anchor="end" font-size="12" font-weight="600" fill="#2563eb">③ Webhook</text>
  <line x1="945" y1="293" x2="945" y2="207" stroke="#2563eb" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <text x="955" y="255" text-anchor="start" font-size="12" font-weight="600" fill="#2563eb">⑦ API</text>

  <!-- ④ n8n -> Telegram (curve underneath) -->
  <path d="M920 447 C920 535 360 535 360 447" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <text x="640" y="525" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">④ Gửi cảnh báo + nút [Ban]</text>

  <!-- ⑤ Telegram <-> Analyst -->
  <line x1="273" y1="370" x2="197" y2="370" stroke="#2563eb" stroke-width="2.5" marker-start="url(#aBlue)" marker-end="url(#aBlue)"/>
  <text x="235" y="360" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">⑤ Ban</text>

  <!-- ⑥ Telegram -> ngrok -> n8n -->
  <line x1="447" y1="370" x2="553" y2="370" stroke="#2563eb" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <text x="500" y="360" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">⑥ callback</text>
  <line x1="727" y1="370" x2="833" y2="370" stroke="#2563eb" stroke-width="2.5" marker-end="url(#aBlue)"/>

  <!-- Legend -->
  <g transform="translate(60,572)" font-size="12" fill="#334155">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#dc2626" stroke-width="3"/>
