  <text x="920" y="173" text-anchor="middle" font-size="12" fill="#475569">Rule 100001 · Level 10</text>
  <text x="920" y="191" text-anchor="middle" font-size="12" fill="#475569">Manager + API :55000</text>

  <!-- Top arrows -->
  <line x1="197" y1="130" x2="383" y2="130" stroke="#dc2626" stroke-width="2.5" marker-end="url(#aRed)"/>
  <text x="290" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">① Brute-Force SSH</text>
  <text x="290" y="150" text-anchor="middle" font-size="11" fill="#64748b">Hydra → port 2222</text>

  <line x1="557" y1="110" x2="833" y2="110" stroke="#475569" stroke-width="2.5" marker-end="url(#aGray)"/>
  <text x="695" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">② Log xác thực (Wazuh Agent)</text>

  <line x1="833" y1="160" x2="557" y2="160" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#aGreen)"/>
  <text x="695" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">A / ⑧ Active Response</text>
  <text x="695" y="196" text-anchor="middle" font-size="11" fill="#16a34a">firewall-drop → iptables DROP</text>

  <!-- ============ BOTTOM ROW ============ -->
