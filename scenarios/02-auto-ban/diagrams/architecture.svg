<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 610" width="1040" height="610" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
  </defs>

  <!-- Background -->
  <rect x="1" y="1" width="1038" height="608" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="520" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Kiến trúc Lab – Kịch bản 02: Auto-Ban &amp; Manual Ban (SOAR)</text>

  <!-- ============ TOP ROW ============ -->
  <!-- Kali -->
  <rect x="25" y="55" width="170" height="150" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <g transform="translate(80,69)">
    <rect x="2" y="4" width="56" height="38" rx="5" fill="#1e293b"/>
    <rect x="6" y="8" width="48" height="30" rx="2" fill="#0f172a"/>
