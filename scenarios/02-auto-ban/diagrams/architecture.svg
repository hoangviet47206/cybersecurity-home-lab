    <path d="M22 36 L30 28 L38 36" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="30" y1="29" x2="30" y2="44" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="640" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#1f1e37">ngrok</text>
  <text x="640" y="413" text-anchor="middle" font-size="12" fill="#475569">Public HTTPS tunnel</text>
  <text x="640" y="431" text-anchor="middle" font-size="12" fill="#475569">→ localhost:5678</text>

  <!-- n8n -->
  <rect x="835" y="295" width="170" height="150" rx="12" fill="#fdf2f8" stroke="#ea4b71" stroke-width="2"/>
  <g transform="translate(890,309)">
    <line x1="12" y1="30" x2="30" y2="14" stroke="#ea4b71" stroke-width="4"/>
    <line x1="12" y1="30" x2="30" y2="46" stroke="#ea4b71" stroke-width="4"/>
    <line x1="30" y1="14" x2="50" y2="30" stroke="#ea4b71" stroke-width="4"/>
    <line x1="30" y1="46" x2="50" y2="30" stroke="#ea4b71" stroke-width="4"/>
    <circle cx="12" cy="30" r="9" fill="#ea4b71"/>
    <circle cx="30" cy="14" r="9" fill="#ea4b71"/>
    <circle cx="30" cy="46" r="9" fill="#ea4b71"/>
    <circle cx="50" cy="30" r="9" fill="#ea4b71"/>
  </g>
  <text x="920" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#9d174d">n8n (SOAR)</text>
  <text x="920" y="413" text-anchor="middle" font-size="12" fill="#475569">Wazuh_SOC.json</text>
  <text x="920" y="431" text-anchor="middle" font-size="12" fill="#475569">Tele_to_Wazuh.json</text>

  <!-- Bottom arrows -->
