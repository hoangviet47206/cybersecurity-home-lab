  <text x="360" y="431" text-anchor="middle" font-size="12" fill="#475569">Bot API</text>

  <!-- ngrok -->
  <rect x="555" y="295" width="170" height="150" rx="12" fill="#f5f3ff" stroke="#1f1e37" stroke-width="2"/>
  <g transform="translate(610,309)">
